name: Concall Monitor

on:
  schedule:
    # Daily at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run concall monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Commit updated state and summaries
        run: |
          git config user.name "Concall Bot"
          git config user.email "bot@concall-monitor.local"
          git add last_concall.json summaries/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "🤖 Update concall state and summaries [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main
          git push
