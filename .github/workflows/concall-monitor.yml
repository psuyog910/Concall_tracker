name: Concall Monitor

on:
  push:
    branches: [ main ]
  schedule:
    # Daily at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI
    inputs:
      test_file:
        description: 'Path to a markdown file in summaries/ to test (e.g. summaries/ACE_2026_02_01.md)'
        required: false
        default: ''
      test_symbol:
        description: 'Symbol for the test'
        required: false
        default: 'TEST_RUN'
      test_pdf_url:
        description: 'Mock PDF URL for the test'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run concall monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.test_file }}" != "" ]; then
            echo "Running manual test for ${{ github.event.inputs.test_file }}..."
            python scraper.py --test "${{ github.event.inputs.test_file }}" --symbol "${{ github.event.inputs.test_symbol }}" --pdf_url "${{ github.event.inputs.test_pdf_url }}"
          else
            python scraper.py
          fi

      - name: Commit updated state and summaries
        run: |
          git config user.name "Concall Bot"
          git config user.email "bot@concall-monitor.local"
          git add last_concall.json summaries/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "🤖 Update concall state and summaries [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main
          git push
