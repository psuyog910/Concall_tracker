name: Concall Monitor

on:
  schedule:
    # Weekdays only (Mon–Fri) at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub UI
    inputs:
      test_file:
        description: 'Path to a markdown file in summaries/ to test (e.g. summaries/ACE_2026_02_01.md)'
        required: false
        default: ''
      test_symbol:
        description: 'Symbol for the test'
        required: false
        default: 'TEST_RUN'
      test_pdf_url:
        description: 'Mock PDF URL for the test'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: concall-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache pip packages — skips re-downloading on every run (~60-90s saved)
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Cache Playwright browser binary — it's ~150 MB and slow to install every time
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright system deps (when restored from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run concall monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Set SEED_QUARTERLY_ONLY=true once to record current quarters without alerts, then remove.
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.test_file }}" != "" ]; then
            echo "Running manual test for ${{ github.event.inputs.test_file }}..."
            python scraper.py --test "${{ github.event.inputs.test_file }}" --symbol "${{ github.event.inputs.test_symbol }}" --pdf_url "${{ github.event.inputs.test_pdf_url }}"
          else
            python scraper.py
          fi

      - name: Commit and push updated state
        run: |
          git config user.name "Concall Bot"
          git config user.email "bot@concall-monitor.local"
          git add last_concall.json last_quarterly.json summaries/ quarterly_cards/
          # Only commit if there are changes
          git diff --staged --quiet || (git commit -m "🤖 Update concall state and summaries [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git pull --rebase origin main && git push)
